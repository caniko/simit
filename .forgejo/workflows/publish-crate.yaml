name: Publish Crate

on:
  push:
    tags:
      - "*.*.*"

jobs:
  publish:
    runs-on: atlas
    container: rust:1.95-trixie
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}
          cache-on-failure: true

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install cargo-binstall
        run: |
          base="https://raw.githubusercontent.com/cargo-bins"
          script="$base/cargo-binstall/main/install-from-binstall-release.sh"
          curl -L --proto '=https' --tlsv1.2 -sSf "$script" | bash

      - name: Install cargo tools
        run: |
          cargo binstall -y --no-confirm \
            cargo-nextest \
            cargo-audit \
            cargo-deny

      - name: Validate tag
        run: |
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version, got '$tag'" >&2
            exit 1
          fi

          version="$(
            cargo metadata --no-deps --format-version 1 \
              | grep -m1 -o '"version":"[^"]*"' \
              | cut -d '"' -f4
          )"
          if [ -z "$version" ]; then
            echo "Could not read package version from cargo metadata" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          fi

      - name: Test all features
        run: cargo nextest run --all-features

      - name: Audit dependencies
        run: cargo audit

      - name: Deny dependency policy
        run: cargo deny check

      - name: Build docs
        run: cargo doc --no-deps --all-features

      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- --deny warnings

      - name: Dry-run publish
        run: cargo publish --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if [ -z "${CRATES_IO_API_TOKEN:-}" ] \
            && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CRATES_IO_API_TOKEN is required to publish to crates.io" >&2
            exit 1
          fi
          CARGO_REGISTRY_TOKEN="${CARGO_REGISTRY_TOKEN:-$CRATES_IO_API_TOKEN}"
          export CARGO_REGISTRY_TOKEN
          cargo publish
