---
# yamllint disable rule:line-length
name: Publish Crate

"on":
  push:
    tags:
      - "*.*.*"

jobs:
  publish:
    runs-on: atlas
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://github.com/cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:uqr0nD3I0mfj9BYfZgTZHMaDKfI2yCTtSA5JGTWKUeg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Flake check
        run: nix flake check --keep-going --print-build-logs

      - name: Validate tag
        run: |
          nix develop --command bash -euo pipefail -c '
            tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-}}"
            if [ -z "$tag" ]; then
              ref="${GITHUB_REF:-${FORGE_REF:-}}"
              tag="${ref#refs/tags/}"
            fi

            if ! printf "%s\n" "$tag" \
              | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"; then
              echo "Tag must be an exact semver version, got '\''$tag'\''" >&2
              exit 1
            fi

            version="$(
              cargo metadata --no-deps --format-version 1 \
                | grep -m1 -o '\''"version":"[^"]*"'\'' \
                | cut -d '\''"'\'' -f4
            )"
            if [ -z "$version" ]; then
              echo "Could not read package version from cargo metadata" >&2
              exit 1
            fi
            if [ "$tag" != "$version" ]; then
              echo "Tag $tag does not match package version $version" >&2
              exit 1
            fi
          '

      - name: Dry-run publish
        run: nix develop --command cargo publish --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if [ -z "${CRATES_IO_API_TOKEN:-}" ] \
            && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CRATES_IO_API_TOKEN is required to publish to crates.io" >&2
            exit 1
          fi
          CARGO_REGISTRY_TOKEN="${CARGO_REGISTRY_TOKEN:-$CRATES_IO_API_TOKEN}"
          export CARGO_REGISTRY_TOKEN
          nix develop --command cargo publish
