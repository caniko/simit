name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: atlas
    container: rust:1.95-trixie
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.workflow }}
          cache-on-failure: true

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install cargo-binstall
        run: |
          base="https://raw.githubusercontent.com/cargo-bins"
          script="$base/cargo-binstall/main/install-from-binstall-release.sh"
          curl -L --proto '=https' --tlsv1.2 -sSf "$script" | bash

      - name: Install cargo tools
        run: |
          cargo binstall -y --no-confirm \
            cargo-nextest \
            cargo-audit \
            cargo-deny

      - name: Test all features
        run: cargo nextest run --all-features

      - name: Check MSRV
        run: cargo +1.95 check --all-targets

      - name: Audit dependencies
        run: cargo audit

      - name: Deny dependency policy
        run: cargo deny check

      - name: Build docs
        run: cargo doc --no-deps --all-features

      - name: Check generated CI
        run: |
          cargo run -- init-ci \
            --platform forgejo \
            --runner atlas \
            --with-msrv \
            --with-audit \
            --with-deny \
            --with-docs \
            --check

      - name: Check generated flake and hooks
        run: cargo run -- init-flake --check

      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- --deny warnings

      - name: Package crate
        run: cargo package --allow-dirty
