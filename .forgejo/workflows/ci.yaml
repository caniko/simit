# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas
    container: rust:1.85-bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/ci.yaml', '.github/workflows/ci.yaml') }}

      - name: Test all features
        run: cargo test --all-features

      - name: Check generated CI
        run: cargo run -- init ci --platform forgejo --check

      - name: Check generated flake and hooks
        run: cargo run -- init flake --check

      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- --deny warnings

      - name: Package crate
        run: cargo package --allow-dirty
