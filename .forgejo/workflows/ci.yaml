name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: codeberg-small
    container: rust:1.85-alpine
    steps:
      - name: Install Alpine tools
        run: apk add --no-cache git build-base

      - name: Checkout
        run: |
          repo="${GITHUB_REPOSITORY:-${FORGE_REPOSITORY:-}}"
          server="${GITHUB_SERVER_URL:-${FORGE_SERVER_URL:-https://codeberg.org}}"
          sha="${GITHUB_SHA:-${FORGE_SHA:-}}"
          ref="${GITHUB_REF:-${FORGE_REF:-}}"
          if [ -z "$repo" ]; then
            echo "Repository name is unavailable" >&2
            exit 1
          fi
          git init .
          git remote add origin "$server/$repo.git"
          if [ -n "$ref" ]; then
            git fetch --depth=1 origin "$ref"
          else
            git fetch --depth=1 origin "$sha"
          fi
          git checkout --detach FETCH_HEAD

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Test all features
        run: cargo test --all-features

      - name: Check generated CI
        run: cargo run -- init-ci --platform forgejo --check

      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- --deny warnings

      - name: Package crate
        run: cargo package --allow-dirty
