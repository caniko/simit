---
name: Publish Pages

"on":
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas
    container: rust:1.85-bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install mdBook
        run: cargo install mdbook --version 0.4.52 --locked

      - name: Build site
        run: mdbook build docs

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/simit/"
          token: ${{ forge.token }}
          source: docs/book/
