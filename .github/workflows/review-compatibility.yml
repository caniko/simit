name: Review engine compatibility
on:
  push:
    branches: [feat/repository-review, trunk]
  pull_request:
permissions:
  contents: read
jobs:
  pinned-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Freeze a deployment lock and build packaged engine and adapter
        env:
          ENGINE_REVISION: ${{ github.sha }}
        run: |
          mkdir controller-lock
          cat > controller-lock/flake.nix <<EOF
          {
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/13043924aaa7375ce482ebe2494338e058282925";
            inputs.simit = { url = "github:caniko/simit/$ENGINE_REVISION"; flake = false; };
            outputs = { self, simit, nixpkgs }: let
              tools = import (simit + "/nix/review-tools.nix") { source = simit; system = "x86_64-linux"; inherit nixpkgs; };
            in {
              packages.x86_64-linux.repo-review = tools.package;
              checks.x86_64-linux.selector = tools.selectorCheck;
            };
          }
          EOF
          nix flake lock ./controller-lock
          nix build ./controller-lock#repo-review --out-link tools --no-update-lock-file -L
          tools/bin/repo-review verify-engine --root controller-lock
          nix build ./controller-lock#checks.x86_64-linux.selector --no-link --no-update-lock-file -L
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: controller-lock
          path: controller-lock/flake.lock
          if-no-files-found: error
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Compile both frontends and verify review contracts on MSRV
        run: cargo +1.85.0 test --locked --test review_cli --test review_engine --test review_generation --test review_contracts
      - name: Verify packaged runtime assets
        shell: bash
        run: |
          cargo +1.85.0 package --list --allow-dirty > package-files.txt
          grep -Fx src/review/assets/nixpkgs.py package-files.txt
          grep -Fx src/review/assets/review-repository.yml package-files.txt
          grep -Fx src/review/assets/publish-review.yml package-files.txt
          grep -Fx src/review/assets/LICENSE package-files.txt
