# Generated by simit. Manual edits will be reported as ci=drift.
# release-plz computes updates and orchestrates publication and signed tags.
# Build code runs only on credential-free workers; trusted jobs transport data.
# Use an App/PAT: GITHUB_TOKEN cannot trigger PR checks or tag workflows.
# Reruns skip published crates; recover missing tags explicitly (see CI adoption docs).
name: Release-plz

on:
  push:
    branches: ["trunk"]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: release-plz-admission-${{ github.repository }}-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      release_sha: ${{ steps.select.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the preceding release-plz event to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .simit/release-plz.py prior-run

      - name: Resolve release-plz immutable revision
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRUST_ROOT: "keys/maintainers.gpg"
        run: python3 .simit/release-plz.py select

  qualify:
    needs: select
    if: needs.select.outputs.release_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve event-owned release policy and publication guard
        run: |
          set -euo pipefail
          cp .simit/release-plz.py "$RUNNER_TEMP/release-plz-admission.py"
          cp release-plz.toml "$RUNNER_TEMP/release-plz.toml"
          git clone --no-hardlinks --no-checkout . "$RUNNER_TEMP/release-plz-event-source"
          mkdir -p "$RUNNER_TEMP/release-plz-guard"
          cat > "$RUNNER_TEMP/release-plz-guard/cargo" <<'SIMIT_CARGO'
          #!/bin/sh
          exec python3 "$RUNNER_TEMP/release-plz-admission.py" cargo "$@"
          SIMIT_CARGO
          chmod 700 "$RUNNER_TEMP/release-plz-guard/cargo"
          cat > "$RUNNER_TEMP/release-plz-credentials" <<'SIMIT_CREDENTIALS'
          #!/bin/sh
          [ "$1" = get ] || exit 0
          protocol= host= path=
          while IFS= read -r line && [ -n "$line" ]; do
            case "$line" in
              protocol=*) protocol=${line#protocol=} ;;
              host=*) host=${line#host=} ;;
              path=*) path=${line#path=} ;;
            esac
          done
          [ "$protocol" = https ] && [ "$host" = github.com ] || exit 0
          [ "$path" = "$GITHUB_REPOSITORY" ] || [ "$path" = "$GITHUB_REPOSITORY.git" ] || exit 0
          printf 'username=x-access-token\npassword=%s\n' "$GIT_TOKEN"
          SIMIT_CREDENTIALS
          chmod 700 "$RUNNER_TEMP/release-plz-credentials"

      - name: Qualify exact release revision
        env:
          SIMIT_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
        run: git checkout --detach "$SIMIT_RELEASE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Project setup 1
        run: printf '%s\n' 'NIX_CONFIG<<SIMIT_NIX_LIMITS' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'SIMIT_NIX_LIMITS' >> "$GITHUB_ENV"

      - name: Project setup 2
        run: if [ "$GITHUB_WORKFLOW" = CI ] && [ "$GITHUB_JOB" = test ]; then nix develop -c bash scripts/qualify-updater-tests.sh; fi

      - name: Format check
        run: |
          # Expand formatter variables inside the Nix shell.
          # shellcheck disable=SC2016
          nix develop -c sh -c 'formatter_expr="let root = toString ./.; flake = builtins.getFlake (if builtins.pathExists ./.git then \"git+file://\" + root else root); in if flake ? formatter.\${builtins.currentSystem} then flake.formatter.\${builtins.currentSystem} else null"; formatter=$(nix eval --impure --raw --expr "let f = ($formatter_expr); in if f == null then \"\" else f.drvPath") || exit; if [ -n "$formatter" ]; then formatter_program=$(nix eval --impure --raw --expr "let f = ($formatter_expr); in f.meta.mainProgram or (f.pname or (builtins.parseDrvName f.name).name)") || exit; formatter_path=$(nix build --no-link --print-out-paths "$formatter^out") || exit; formatter_exe="$formatter_path/bin/$formatter_program"; if [ ! -x "$formatter_exe" ]; then echo "Declared flake formatter executable is missing: $formatter_exe" >&2; exit 1; fi; if [ "$formatter_program" = treefmt ]; then exec "$formatter_exe" --ci; fi; repository_root=$(git rev-parse --show-toplevel) || exit; index_tree=$(git -C "$repository_root" write-tree) || exit; snapshot_dir=$(mktemp -d "${TMPDIR:-/tmp}/simit-format.XXXXXXXX") || exit; trap "rm -rf -- \"\$snapshot_dir\"" 0; trap "exit 129" HUP; trap "exit 130" INT; trap "exit 143" TERM; snapshot_dir=$(cd "$snapshot_dir" && pwd -P) || exit; case "$snapshot_dir/" in "$repository_root/"*) echo "Formatter snapshot directory must be outside the repository" >&2; exit 1;; esac; snapshot_worktree() { GIT_INDEX_FILE="$snapshot_dir/index" git -C "$repository_root" read-tree "$index_tree" && GIT_INDEX_FILE="$snapshot_dir/index" git -C "$repository_root" add --all -- . && GIT_INDEX_FILE="$snapshot_dir/index" git -C "$repository_root" write-tree; }; before_tree=$(snapshot_worktree) || exit; "$formatter_exe" || exit; after_tree=$(snapshot_worktree) || exit; current_index=$(git -C "$repository_root" write-tree) || exit; if [ "$before_tree" != "$after_tree" ] || [ "$index_tree" != "$current_index" ]; then echo "Formatter modified repository content or staging" >&2; exit 1; fi; exit 0; fi; if command -v treefmt >/dev/null 2>&1; then exec treefmt --ci; else exec cargo fmt --all -- --check; fi'

      - name: Check flake
        run: nix flake check --no-build

      - name: Qualify declared Nix installables
        run: nix build --no-link .#default

      - name: Test all features
        run: nix develop -c cargo test -p simit --all-features

      - name: Test no default features
        run: nix develop -c cargo test -p simit --no-default-features

      - name: Clippy all features
        run: nix develop -c cargo clippy -p simit --all-targets --all-features -- --deny warnings

      - name: Clippy no default features
        run: nix develop -c cargo clippy -p simit --all-targets --no-default-features -- --deny warnings

      - name: Build docs
        run: nix develop .#docs -c cargo doc -p simit --no-deps --all-features

      - name: Verify package archives including unpublished workspace dependencies
        run: |
          set -euo pipefail
          package_cargo=$(rustup which --toolchain stable cargo)
          nix develop -c "$package_cargo" package --locked --allow-dirty --package simit --target-dir "$RUNNER_TEMP/release-plz-package"

      - name: Retain qualified crate archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plz-crates-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/release-plz-package/package/*.crate

  publish:
    needs: [select, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve event-owned release policy and publication guard
        run: |
          set -euo pipefail
          cp .simit/release-plz.py "$RUNNER_TEMP/release-plz-admission.py"
          cp release-plz.toml "$RUNNER_TEMP/release-plz.toml"
          git clone --no-hardlinks --no-checkout . "$RUNNER_TEMP/release-plz-event-source"
          mkdir -p "$RUNNER_TEMP/release-plz-guard"
          cat > "$RUNNER_TEMP/release-plz-guard/cargo" <<'SIMIT_CARGO'
          #!/bin/sh
          exec python3 "$RUNNER_TEMP/release-plz-admission.py" cargo "$@"
          SIMIT_CARGO
          chmod 700 "$RUNNER_TEMP/release-plz-guard/cargo"
          cat > "$RUNNER_TEMP/release-plz-credentials" <<'SIMIT_CREDENTIALS'
          #!/bin/sh
          [ "$1" = get ] || exit 0
          protocol= host= path=
          while IFS= read -r line && [ -n "$line" ]; do
            case "$line" in
              protocol=*) protocol=${line#protocol=} ;;
              host=*) host=${line#host=} ;;
              path=*) path=${line#path=} ;;
            esac
          done
          [ "$protocol" = https ] && [ "$host" = github.com ] || exit 0
          [ "$path" = "$GITHUB_REPOSITORY" ] || [ "$path" = "$GITHUB_REPOSITORY.git" ] || exit 0
          printf 'username=x-access-token\npassword=%s\n' "$GIT_TOKEN"
          SIMIT_CREDENTIALS
          chmod 700 "$RUNNER_TEMP/release-plz-credentials"

      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: /
        run: cargo build --release --locked --manifest-path "$GITHUB_WORKSPACE/.simit-publisher-engine/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/.simit-publisher-engine/target"
      - name: Preserve qualified publisher outside project checkouts
        run: cp .simit-publisher-engine/target/release/simit "$RUNNER_TEMP/simit-release-plz-publisher"

      - name: Install pinned release-plz 0.3.172
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-plz/bin"
          archive="$RUNNER_TEMP/release-plz.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            'https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.172/release-plz-x86_64-unknown-linux-gnu.tar.gz' -o "$archive"
          printf '%s  %s\n' '84b7013d164e1fc780b31dc9ef190977830599d6cb5ce81c993f6fcbd3cdc1aa' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-plz/bin" release-plz
          "$RUNNER_TEMP/release-plz/bin/release-plz" --version

      - name: Download same-run qualified archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plz-crates-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plz-archives

      - name: Recheck immutable release selection
        working-directory: ${{ runner.temp }}/release-plz-event-source
        env:
          GH_TOKEN: ${{ github.token }}
          SIMIT_EXPECTED_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
          RELEASE_TRUST_ROOT: "keys/maintainers.gpg"
        run: python3 "$RUNNER_TEMP/release-plz-admission.py" select

      - name: Reconstruct qualified archives and reconcile all registry versions without credentials
        env:
          SIMIT_EXPECTED_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
          SIMIT_RELEASE_PLZ_SOURCE: ${{ runner.temp }}/release-plz-event-source
        run: |
          "$RUNNER_TEMP/simit-release-plz-publisher" release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --release-plz-archives "$RUNNER_TEMP/release-plz-archives" --release-plz-check-registry

      - name: Configure authorized tag signing
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_PLZ_GPG_PRIVATE_KEY }}
          RELEASE_PASSPHRASE: ${{ secrets.RELEASE_PLZ_GPG_PASSPHRASE }}
          RELEASE_TRUST_ROOT: "keys/maintainers.gpg"
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY" || { echo 'Missing release-plz signing key' >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/release-plz-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_KEY" | gpg --batch --import
          python3 "$RUNNER_TEMP/release-plz-admission.py" identity "$RELEASE_TRUST_ROOT"
          printf '%s' "$RELEASE_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          cat > "$GNUPGHOME/gpg-sign" <<'SIMIT_GPG'
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" "$@"
          SIMIT_GPG
          chmod 700 "$GNUPGHOME/gpg-sign"
          git config --local gpg.program "$GNUPGHOME/gpg-sign"
          git config --local tag.gpgSign true
          git config --local commit.gpgSign true
          printf 'release-plz signing probe' | "$GNUPGHOME/gpg-sign" --local-user "$(git config user.signingkey)" --detach-sign > "$GNUPGHOME/probe.sig"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Publish verified archives and signed tags
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
          SIMIT_EXPECTED_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
          SIMIT_RELEASE_PLZ_PUBLISHER: ${{ runner.temp }}/simit-release-plz-publisher
        run: |
          set -euo pipefail
          test -n "$GIT_TOKEN" && test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Missing release-plz automation/registry token' >&2; exit 1; }
          python3 "$RUNNER_TEMP/release-plz-admission.py" run release --config "$RUNNER_TEMP/release-plz.toml"

      - name: Remove signing material
        if: always()
        run: |
          git config --local --unset-all credential.helper || true
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/release-plz-gnupg"

  prepare-pr:
    needs: [select, publish]
    if: always() && needs.select.result == 'success' && (needs.publish.result == 'success' || (needs.select.outputs.release_sha == '' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve event-owned release policy and publication guard
        run: |
          set -euo pipefail
          cp .simit/release-plz.py "$RUNNER_TEMP/release-plz-admission.py"
          cp release-plz.toml "$RUNNER_TEMP/release-plz.toml"
          git clone --no-hardlinks --no-checkout . "$RUNNER_TEMP/release-plz-event-source"
          mkdir -p "$RUNNER_TEMP/release-plz-guard"
          cat > "$RUNNER_TEMP/release-plz-guard/cargo" <<'SIMIT_CARGO'
          #!/bin/sh
          exec python3 "$RUNNER_TEMP/release-plz-admission.py" cargo "$@"
          SIMIT_CARGO
          chmod 700 "$RUNNER_TEMP/release-plz-guard/cargo"
          cat > "$RUNNER_TEMP/release-plz-credentials" <<'SIMIT_CREDENTIALS'
          #!/bin/sh
          [ "$1" = get ] || exit 0
          protocol= host= path=
          while IFS= read -r line && [ -n "$line" ]; do
            case "$line" in
              protocol=*) protocol=${line#protocol=} ;;
              host=*) host=${line#host=} ;;
              path=*) path=${line#path=} ;;
            esac
          done
          [ "$protocol" = https ] && [ "$host" = github.com ] || exit 0
          [ "$path" = "$GITHUB_REPOSITORY" ] || [ "$path" = "$GITHUB_REPOSITORY.git" ] || exit 0
          printf 'username=x-access-token\npassword=%s\n' "$GIT_TOKEN"
          SIMIT_CREDENTIALS
          chmod 700 "$RUNNER_TEMP/release-plz-credentials"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Project setup 1
        run: printf '%s\n' 'NIX_CONFIG<<SIMIT_NIX_LIMITS' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'SIMIT_NIX_LIMITS' >> "$GITHUB_ENV"

      - name: Project setup 2
        run: if [ "$GITHUB_WORKFLOW" = CI ] && [ "$GITHUB_JOB" = test ]; then nix develop -c bash scripts/qualify-updater-tests.sh; fi

      - name: Install pinned release-plz 0.3.172
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-plz/bin"
          archive="$RUNNER_TEMP/release-plz.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            'https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.172/release-plz-x86_64-unknown-linux-gnu.tar.gz' -o "$archive"
          printf '%s  %s\n' '84b7013d164e1fc780b31dc9ef190977830599d6cb5ce81c993f6fcbd3cdc1aa' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-plz/bin" release-plz
          nix develop -c "$RUNNER_TEMP/release-plz/bin/release-plz" --version

      - name: Compute release-plz versions and changelogs without release credentials
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git switch --force-create "$GITHUB_REF_NAME" "$GITHUB_SHA"
          nix develop -c python3 "$RUNNER_TEMP/release-plz-admission.py" update --config "$RUNNER_TEMP/release-plz.toml" | tee "$RUNNER_TEMP/release-plz-update.log"
          python3 "$RUNNER_TEMP/release-plz-admission.py" prepare-pr

      - name: Retain release-plz update data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plz-pr-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/release-plz-pr/

  release-pr:
    needs: [select, prepare-pr]
    if: always() && needs.select.result == 'success' && needs.prepare-pr.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-plz-pr-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve event-owned release policy and publication guard
        run: |
          set -euo pipefail
          cp .simit/release-plz.py "$RUNNER_TEMP/release-plz-admission.py"
          cp release-plz.toml "$RUNNER_TEMP/release-plz.toml"
          git clone --no-hardlinks --no-checkout . "$RUNNER_TEMP/release-plz-event-source"
          mkdir -p "$RUNNER_TEMP/release-plz-guard"
          cat > "$RUNNER_TEMP/release-plz-guard/cargo" <<'SIMIT_CARGO'
          #!/bin/sh
          exec python3 "$RUNNER_TEMP/release-plz-admission.py" cargo "$@"
          SIMIT_CARGO
          chmod 700 "$RUNNER_TEMP/release-plz-guard/cargo"
          cat > "$RUNNER_TEMP/release-plz-credentials" <<'SIMIT_CREDENTIALS'
          #!/bin/sh
          [ "$1" = get ] || exit 0
          protocol= host= path=
          while IFS= read -r line && [ -n "$line" ]; do
            case "$line" in
              protocol=*) protocol=${line#protocol=} ;;
              host=*) host=${line#host=} ;;
              path=*) path=${line#path=} ;;
            esac
          done
          [ "$protocol" = https ] && [ "$host" = github.com ] || exit 0
          [ "$path" = "$GITHUB_REPOSITORY" ] || [ "$path" = "$GITHUB_REPOSITORY.git" ] || exit 0
          printf 'username=x-access-token\npassword=%s\n' "$GIT_TOKEN"
          SIMIT_CREDENTIALS
          chmod 700 "$RUNNER_TEMP/release-plz-credentials"

      - name: Download prepared release PR data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plz-pr-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plz-pr

      - name: Admit only release data into the event index
        run: python3 "$RUNNER_TEMP/release-plz-admission.py" admit-pr

      - name: Configure authorized tag signing
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_PLZ_GPG_PRIVATE_KEY }}
          RELEASE_PASSPHRASE: ${{ secrets.RELEASE_PLZ_GPG_PASSPHRASE }}
          RELEASE_TRUST_ROOT: "keys/maintainers.gpg"
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY" || { echo 'Missing release-plz signing key' >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/release-plz-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_KEY" | gpg --batch --import
          python3 "$RUNNER_TEMP/release-plz-admission.py" identity "$RELEASE_TRUST_ROOT"
          printf '%s' "$RELEASE_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          cat > "$GNUPGHOME/gpg-sign" <<'SIMIT_GPG'
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" "$@"
          SIMIT_GPG
          chmod 700 "$GNUPGHOME/gpg-sign"
          git config --local gpg.program "$GNUPGHOME/gpg-sign"
          git config --local tag.gpgSign true
          git config --local commit.gpgSign true
          printf 'release-plz signing probe' | "$GNUPGHOME/gpg-sign" --local-user "$(git config user.signingkey)" --detach-sign > "$GNUPGHOME/probe.sig"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Deliver signed release-plz update without executing project code
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_TRUST_ROOT: "keys/maintainers.gpg"
        run: |
          set -euo pipefail
          test -n "$GIT_TOKEN" || { echo 'Missing release-plz automation token' >&2; exit 1; }
          python3 "$RUNNER_TEMP/release-plz-admission.py" apply-pr

      - name: Remove signing material
        if: always()
        run: |
          git config --local --unset-all credential.helper || true
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/release-plz-gnupg"
