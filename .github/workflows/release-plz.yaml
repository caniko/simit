# Generated by simit. Manual edits will be reported as ci=drift.
# release-plz owns release PRs, crates.io publication and signed tags.
# Use an App/PAT: GITHUB_TOKEN cannot trigger PR checks or tag workflows.
# Reruns skip published crates; recover missing tags explicitly (see CI adoption docs).
name: Release-plz

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_sha: ${{ steps.select.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release-plz immutable revision
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .simit/release-plz.py select

  qualify:
    needs: select
    if: needs.select.outputs.release_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve event-owned release policy and publication guard
        run: |
          set -euo pipefail
          cp .simit/release-plz.py "$RUNNER_TEMP/release-plz-admission.py"
          cp release-plz.toml "$RUNNER_TEMP/release-plz.toml"
          mkdir -p "$RUNNER_TEMP/release-plz-guard"
          cat > "$RUNNER_TEMP/release-plz-guard/cargo" <<'SIMIT_CARGO'
          #!/bin/sh
          exec python3 "$RUNNER_TEMP/release-plz-admission.py" cargo "$@"
          SIMIT_CARGO
          chmod 700 "$RUNNER_TEMP/release-plz-guard/cargo"
          cat > "$RUNNER_TEMP/release-plz-credentials" <<'SIMIT_CREDENTIALS'
          #!/bin/sh
          if [ "$1" = get ]; then
            printf 'username=x-access-token\npassword=%s\n' "$GIT_TOKEN"
          fi
          SIMIT_CREDENTIALS
          chmod 700 "$RUNNER_TEMP/release-plz-credentials"

      - name: Qualify exact release revision
        env:
          SIMIT_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
        run: git checkout --detach "$SIMIT_RELEASE_SHA"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Project setup 1
        run: printf '%s\n' 'NIX_CONFIG<<SIMIT_NIX_LIMITS' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'SIMIT_NIX_LIMITS' >> "$GITHUB_ENV"

      - name: Project setup 2
        run: if [ "$GITHUB_WORKFLOW" = CI ] && [ "$GITHUB_JOB" = test ]; then nix develop -c bash scripts/qualify-updater-tests.sh; fi

      - name: Format check
        run: |
          # Expand formatter variables inside the Nix shell.
          # shellcheck disable=SC2016
          nix develop -c sh -c 'formatter_expr="let root = toString ./.; flake = builtins.getFlake (if builtins.pathExists ./.git then \"git+file://\" + root else root); in if flake ? formatter.\${builtins.currentSystem} then flake.formatter.\${builtins.currentSystem} else null"; formatter=$(nix eval --impure --raw --expr "let f = ($formatter_expr); in if f == null then \"\" else f.drvPath") || exit; if [ -n "$formatter" ]; then formatter_program=$(nix eval --impure --raw --expr "let f = ($formatter_expr); in f.meta.mainProgram or (f.pname or (builtins.parseDrvName f.name).name)") || exit; formatter_path=$(nix build --no-link --print-out-paths "$formatter^out") || exit; formatter_exe="$formatter_path/bin/$formatter_program"; if [ ! -x "$formatter_exe" ]; then echo "Declared flake formatter executable is missing: $formatter_exe" >&2; exit 1; fi; if [ "$formatter_program" = treefmt ]; then exec "$formatter_exe" --ci; fi; repository_root=$(git rev-parse --show-toplevel) || exit; index_tree=$(git -C "$repository_root" write-tree) || exit; snapshot_dir=$(mktemp -d "${TMPDIR:-/tmp}/simit-format.XXXXXXXX") || exit; trap "rm -rf -- \"\$snapshot_dir\"" 0; trap "exit 129" HUP; trap "exit 130" INT; trap "exit 143" TERM; snapshot_dir=$(cd "$snapshot_dir" && pwd -P) || exit; case "$snapshot_dir/" in "$repository_root/"*) echo "Formatter snapshot directory must be outside the repository" >&2; exit 1;; esac; snapshot_worktree() { GIT_INDEX_FILE="$snapshot_dir/index" git -C "$repository_root" read-tree "$index_tree" && GIT_INDEX_FILE="$snapshot_dir/index" git -C "$repository_root" add --all -- . && GIT_INDEX_FILE="$snapshot_dir/index" git -C "$repository_root" write-tree; }; before_tree=$(snapshot_worktree) || exit; "$formatter_exe" || exit; after_tree=$(snapshot_worktree) || exit; current_index=$(git -C "$repository_root" write-tree) || exit; if [ "$before_tree" != "$after_tree" ] || [ "$index_tree" != "$current_index" ]; then echo "Formatter modified repository content or staging" >&2; exit 1; fi; exit 0; fi; if command -v treefmt >/dev/null 2>&1; then exec treefmt --ci; else exec cargo fmt --all -- --check; fi'

      - name: Check flake
        run: nix flake check

      - name: Qualify declared Nix installables
        run: nix build --no-link .#default

      - name: Test all features
        run: nix develop -c cargo test -p simit --all-features

      - name: Test no default features
        run: nix develop -c cargo test -p simit --no-default-features

      - name: Clippy all features
        run: nix develop -c cargo clippy -p simit --all-targets --all-features -- --deny warnings

      - name: Clippy no default features
        run: nix develop -c cargo clippy -p simit --all-targets --no-default-features -- --deny warnings

      - name: Build docs
        run: nix develop .#docs -c cargo doc -p simit --no-deps --all-features

      - name: Install pinned release-plz 0.3.172
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-plz/bin"
          archive="$RUNNER_TEMP/release-plz.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            'https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.172/release-plz-x86_64-unknown-linux-musl.tar.gz' -o "$archive"
          printf '%s  %s\n' 'db58a4668ce9ef0b6431e96a665715745e9a5d7f0b0b28a610034d94de3970df' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-plz/bin" release-plz
          nix develop -c "$RUNNER_TEMP/release-plz/bin/release-plz" --version

      - name: Qualify release-plz release dry run
        env:
          GIT_TOKEN: ${{ github.token }}
          SIMIT_EXPECTED_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$GITHUB_SHA"
          nix develop -c python3 "$RUNNER_TEMP/release-plz-admission.py" run release --dry-run --config "$RUNNER_TEMP/release-plz.toml"

  publish:
    needs: [select, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve event-owned release policy and publication guard
        run: |
          set -euo pipefail
          cp .simit/release-plz.py "$RUNNER_TEMP/release-plz-admission.py"
          cp release-plz.toml "$RUNNER_TEMP/release-plz.toml"
          mkdir -p "$RUNNER_TEMP/release-plz-guard"
          cat > "$RUNNER_TEMP/release-plz-guard/cargo" <<'SIMIT_CARGO'
          #!/bin/sh
          exec python3 "$RUNNER_TEMP/release-plz-admission.py" cargo "$@"
          SIMIT_CARGO
          chmod 700 "$RUNNER_TEMP/release-plz-guard/cargo"
          cat > "$RUNNER_TEMP/release-plz-credentials" <<'SIMIT_CREDENTIALS'
          #!/bin/sh
          if [ "$1" = get ]; then
            printf 'username=x-access-token\npassword=%s\n' "$GIT_TOKEN"
          fi
          SIMIT_CREDENTIALS
          chmod 700 "$RUNNER_TEMP/release-plz-credentials"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Install pinned release-plz 0.3.172
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-plz/bin"
          archive="$RUNNER_TEMP/release-plz.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            'https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.172/release-plz-x86_64-unknown-linux-musl.tar.gz' -o "$archive"
          printf '%s  %s\n' 'db58a4668ce9ef0b6431e96a665715745e9a5d7f0b0b28a610034d94de3970df' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-plz/bin" release-plz
          nix develop -c "$RUNNER_TEMP/release-plz/bin/release-plz" --version

      - name: Recheck immutable release selection
        env:
          GH_TOKEN: ${{ github.token }}
          SIMIT_EXPECTED_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
        run: python3 "$RUNNER_TEMP/release-plz-admission.py" select

      - name: Configure authorized tag signing
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_PLZ_GPG_PRIVATE_KEY }}
          RELEASE_PASSPHRASE: ${{ secrets.RELEASE_PLZ_GPG_PASSPHRASE }}
          RELEASE_TRUST_ROOT: "keys/maintainers.gpg"
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY" || { echo 'Missing release-plz signing key' >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/release-plz-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_KEY" | gpg --batch --import
          python3 "$RUNNER_TEMP/release-plz-admission.py" identity "$RELEASE_TRUST_ROOT"
          printf '%s' "$RELEASE_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          cat > "$GNUPGHOME/gpg-sign" <<'SIMIT_GPG'
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" "$@"
          SIMIT_GPG
          chmod 700 "$GNUPGHOME/gpg-sign"
          git config --local gpg.program "$GNUPGHOME/gpg-sign"
          git config --local tag.gpgSign true
          git config --local commit.gpgSign true
          printf 'release-plz signing probe' | "$GNUPGHOME/gpg-sign" --local-user "$(git config user.signingkey)" --detach-sign > "$GNUPGHOME/probe.sig"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Publish qualified crates and signed tags
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
          SIMIT_EXPECTED_RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$GIT_TOKEN" && test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Missing release-plz automation/registry token' >&2; exit 1; }
          git config --local credential.helper "$RUNNER_TEMP/release-plz-credentials"
          nix develop -c python3 "$RUNNER_TEMP/release-plz-admission.py" run release --config "$RUNNER_TEMP/release-plz.toml"

      - name: Remove signing material
        if: always()
        run: |
          git config --local --unset-all credential.helper || true
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/release-plz-gnupg"

  release-pr:
    needs: [select, qualify, publish]
    if: always() && needs.select.result == 'success' && (needs.qualify.result == 'success' || needs.select.outputs.release_sha == '') && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve event-owned release policy and publication guard
        run: |
          set -euo pipefail
          cp .simit/release-plz.py "$RUNNER_TEMP/release-plz-admission.py"
          cp release-plz.toml "$RUNNER_TEMP/release-plz.toml"
          mkdir -p "$RUNNER_TEMP/release-plz-guard"
          cat > "$RUNNER_TEMP/release-plz-guard/cargo" <<'SIMIT_CARGO'
          #!/bin/sh
          exec python3 "$RUNNER_TEMP/release-plz-admission.py" cargo "$@"
          SIMIT_CARGO
          chmod 700 "$RUNNER_TEMP/release-plz-guard/cargo"
          cat > "$RUNNER_TEMP/release-plz-credentials" <<'SIMIT_CREDENTIALS'
          #!/bin/sh
          if [ "$1" = get ]; then
            printf 'username=x-access-token\npassword=%s\n' "$GIT_TOKEN"
          fi
          SIMIT_CREDENTIALS
          chmod 700 "$RUNNER_TEMP/release-plz-credentials"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Install pinned release-plz 0.3.172
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-plz/bin"
          archive="$RUNNER_TEMP/release-plz.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            'https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.172/release-plz-x86_64-unknown-linux-musl.tar.gz' -o "$archive"
          printf '%s  %s\n' 'db58a4668ce9ef0b6431e96a665715745e9a5d7f0b0b28a610034d94de3970df' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-plz/bin" release-plz
          nix develop -c "$RUNNER_TEMP/release-plz/bin/release-plz" --version

      - name: Restore release PR base branch at the event revision
        run: git switch --force-create "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Configure authorized tag signing
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_PLZ_GPG_PRIVATE_KEY }}
          RELEASE_PASSPHRASE: ${{ secrets.RELEASE_PLZ_GPG_PASSPHRASE }}
          RELEASE_TRUST_ROOT: "keys/maintainers.gpg"
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY" || { echo 'Missing release-plz signing key' >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/release-plz-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_KEY" | gpg --batch --import
          python3 "$RUNNER_TEMP/release-plz-admission.py" identity "$RELEASE_TRUST_ROOT"
          printf '%s' "$RELEASE_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          cat > "$GNUPGHOME/gpg-sign" <<'SIMIT_GPG'
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" "$@"
          SIMIT_GPG
          chmod 700 "$GNUPGHOME/gpg-sign"
          git config --local gpg.program "$GNUPGHOME/gpg-sign"
          git config --local tag.gpgSign true
          git config --local commit.gpgSign true
          printf 'release-plz signing probe' | "$GNUPGHOME/gpg-sign" --local-user "$(git config user.signingkey)" --detach-sign > "$GNUPGHOME/probe.sig"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Update release PR
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GIT_TOKEN" || { echo 'Missing release-plz automation token' >&2; exit 1; }
          git config --local credential.helper "$RUNNER_TEMP/release-plz-credentials"
          nix develop -c python3 "$RUNNER_TEMP/release-plz-admission.py" run release-pr --config "$RUNNER_TEMP/release-plz.toml"

      - name: Remove signing material
        if: always()
        run: |
          git config --local --unset-all credential.helper || true
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/release-plz-gnupg"
