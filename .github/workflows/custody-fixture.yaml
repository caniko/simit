# Simit workflow template: .simit/workflows/custody-fixture.yaml.in
# Generated by simit. Manual edits will be reported as ci=drift.
name: Custody qualification fixture

on:
  push:
    branches: ["trunk"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: custody-fixture-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact producer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Produce source-bound inert archive data
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'custody-fixture'
          root.mkdir()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['GITHUB_SHA']
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              expected = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['pull_request']['head']['sha']
          assert head == expected
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          payload = b'raise RuntimeError("Custody must never execute producer archive data")\n'
          (root / 'inert-producer-data.py').write_bytes(payload)
          identity = {'head': head, 'tree': tree, 'run': os.environ['GITHUB_RUN_ID'],
                      'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'event': os.environ['GITHUB_EVENT_NAME'],
                      'repository': os.environ['GITHUB_REPOSITORY'], 'payload_sha256': hashlib.sha256(payload).hexdigest()}
          (root / 'source.json').write_text(json.dumps(identity, indent=2) + '\n')
          print(json.dumps(identity))
      - name: Upload enrolled fixture data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: custody-fixture
          if-no-files-found: error
          retention-days: 32
          path: ${{ runner.temp }}/custody-fixture
