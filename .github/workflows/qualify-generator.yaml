# Simit workflow template: .simit/workflows/qualify-generator.yaml.in
# Generated by simit. Manual edits will be reported as ci=drift.
name: Qualify generator and retain regeneration

on:
  push:
    branches: ["fix/hermes-workflow-templates"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        max-jobs = 1
        cores = 2
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout exact execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Capture execution identity
        run: |
          mkdir -p "$RUNNER_TEMP/generator-qualification"
          git rev-parse HEAD > "$RUNNER_TEMP/generator-qualification/revision"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/generator-qualification/tree"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/generator-qualification/source.sha256"
      - name: Build exact production generator
        run: |
          set -euo pipefail
          nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --json .#default > "$RUNNER_TEMP/generator-qualification/result.json"
      - name: Regenerate through this exact Simit source
        run: |
          set -euo pipefail
          generator=$(python3 -c 'import json,os; print(os.path.join(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "generator-qualification/result.json")))[0]["outputs"]["out"], "bin/simit"))')
          "$generator" init ci --platform github --runtime nix --runner ubuntu-latest --with-docs --publish-crates
          "$generator" init ci --platform github --runtime nix --runner ubuntu-latest --with-docs --publish-crates --check --diff
          git diff --check
          git diff > "$RUNNER_TEMP/generator-qualification/regenerated.diff"
          tar -czf "$RUNNER_TEMP/generator-qualification/regenerated.tar.gz" Cargo.toml .github/workflows .simit/workflows
          sha256sum "$RUNNER_TEMP/generator-qualification/regenerated.tar.gz" > "$RUNNER_TEMP/generator-qualification/regenerated.sha256"
      - name: Retain per-attempt qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generator-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 31
          if-no-files-found: error
          path: ${{ runner.temp }}/generator-qualification/**
