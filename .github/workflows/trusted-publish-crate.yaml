# Generated by simit. Manual edits will be reported as ci=drift.
# Enroll only after moving CRATES_IO_API_TOKEN into the literal environment below,
# restricting it to the exact protected default branch, and qualifying the engine revision.
# Tag-controlled workflows must have no repository/org publishing credential.
# Recovery: rerun the original signed-tag run; matching immutable archives remain reusable.
name: Trusted Crate Publisher

on:
  workflow_run:
    workflows: ["Build Crate"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: simit-crates-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-simit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: .simit-publisher-engine
        run: cargo build --release --locked
      - name: Admit signed source and provider-bound archive simit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package simit --source-workflow .github/workflows/publish-crate.yaml --publisher-workflow .github/workflows/trusted-publish-crate.yaml --reconstruct-package simit --publisher-output "$RUNNER_TEMP/verified-simit" > "$RUNNER_TEMP/verified-simit.json"
      - name: Verify packaged contents simit
        working-directory: ${{ runner.temp }}
        run: cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-simit/Cargo.toml"
  publish-simit:
    needs: [verify-simit]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: simit-crates-io
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: .simit-publisher-engine
        run: cargo build --release --locked
      - name: Upload independently verified archive simit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: .simit-publisher-engine/target/release/simit release publisher --publisher-stage publish --repo "$GITHUB_REPOSITORY" --package simit --source-workflow .github/workflows/publish-crate.yaml --publisher-workflow .github/workflows/trusted-publish-crate.yaml --reconstruct-package simit
  publish-report:
    needs: [publish-simit]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Release result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          echo 'resume: rerun the original tag-push run; already-published crates with matching checksums exit 0 after exact registry resolution'
          echo 'see per-crate job statuses for the auditable result'
