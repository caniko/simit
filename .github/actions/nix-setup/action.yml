name: Install Nix
description: Install Nix using Simit's pinned Cachix installer.
inputs:
  extra_nix_config:
    description: Additional lines to append to nix.conf.
    required: false
  install_url:
    description: Override the Nix installer URL.
    required: false
  nix_path:
    description: Set NIX_PATH.
    required: false
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: ${{ inputs.extra_nix_config }}
        install_url: ${{ inputs.install_url }}
        nix_path: ${{ inputs.nix_path }}
