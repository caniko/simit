[package]
name = "simit"
version = "0.17.10"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Semver-aware git commit helper for Rust projects"
repository = "https://codeberg.org/caniko/simit"
documentation = "https://docs.rs/simit"
readme = "README.md"
keywords = ["git", "semver", "release", "cargo", "commit"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/ci-actions.json",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/src/**/*.rs",
  "/tests/**/*.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.simit.flake]
scope = "full"

[package.metadata.simit.release.changelog]
auto_draft = true

[package.metadata.simit.release.github]
repo = "caniko/simit"
target_branch = "trunk"

[package.metadata.simit.release.artifacts]
prebuild_binaries = true
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
version_attr = "simit"
checksum_globs = ["*.tar.gz"]
minisign_pub = "keys/minisign.pub"
sign = true

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
directories-next = "2"
fs2 = "0.4"
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml_edit = { version = "0.25", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
