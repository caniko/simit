[workspace]
# The trusted publisher checks this source out beneath a candidate workspace.
# Keep its resolution and locked engine build independent of that candidate.
resolver = "3"

[package]
name = "simit"
default-run = "simit"
version = "0.20.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Semver-aware git commit helper for Rust projects"
repository = "https://github.com/caniko/simit"
documentation = "https://docs.rs/simit"
readme = "README.md"
keywords = ["git", "semver", "release", "cargo", "commit"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/ci-actions.json",
  "/.github/workflows/*.yaml",
  "/.github/workflows/*.yml",
  "/.simit/workflows/**",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/src/**/*.rs",
  "/src/monorepo/native_release.py",
  "/src/render/ci/*.py",
  "/src/review/assets/**",
  "/tests/**/*.rs",
  "/tests/fixtures/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.simit.flake]
scope = "full"

[package.metadata.simit.ci]
platform = "github"
provider = "actions"
extra_setup = [
  "printf '%s\\n' 'NIX_CONFIG<<SIMIT_NIX_LIMITS' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'SIMIT_NIX_LIMITS' >> \"$GITHUB_ENV\"",
]

[package.metadata.simit.ci.extra_env]
CARGO_BUILD_JOBS = "2"

[package.metadata.simit.ci.workflow_templates]
".github/workflows/qualify-generator.yaml" = ".simit/workflows/qualify-generator.yaml.in"
".github/workflows/custody-fixture.yaml" = ".simit/workflows/custody-fixture.yaml.in"
".github/workflows/qualify-nix-transport.yaml" = ".simit/workflows/qualify-nix-transport.yaml.in"
".github/workflows/qualify-native-groups.yaml" = ".simit/workflows/qualify-native-groups.yaml.in"

[package.metadata.simit.ci.custody]
repository = "caniko/simit"
producer_attempt = 1
status_context = "simit/producer-custody"

[package.metadata.simit.ci.custody.producers.CI]
workflow = ".github/workflows/ci.yaml"
jobs = ["test"]

[package.metadata.simit.ci.custody.producers."Custody qualification fixture"]
workflow = ".github/workflows/custody-fixture.yaml"
jobs = ["fixture"]
artifacts = ["custody-fixture"]

[package.metadata.simit.ci.pages]
repo = "caniko/simit"
canonical_domain = "simit.tartanoglu.com"

[package.metadata.simit.release.changelog]
auto_draft = true

[package.metadata.simit.release.github]
repo = "caniko/simit"
target_branch = "trunk"

[package.metadata.simit.release.artifacts]
prebuild_binaries = true
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
version_attr = "simit-x86_64-linux-musl"
checksum_globs = ["*.tar.gz"]
minisign_pub = "keys/minisign.pub"
sign = true

[dependencies]
anyhow = "1"
base64 = "0.22"
camino = { version = "1", features = ["serde1"] }
caseless = "0.2.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
directories-next = "2"
fs2 = "0.4"
flate2 = "1"
glob = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "native-tls-vendored",
] }
rnix = "0.12"
same-file = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
schemars = "1"
url = "2"
unicode-normalization = "0.1.25"
toml_edit = { version = "0.25", features = ["serde"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[example]]
name = "ci-stream-oracle"
path = "tests/fixtures/ci-stream-oracle.rs"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = "0.6.1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"
rustix = { version = "1", features = ["fs", "process"] }
