[package]
name = "simit"
version = "0.17.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Semver-aware git commit helper for Rust projects"
repository = "https://codeberg.org/caniko/simit"
documentation = "https://docs.rs/simit"
readme = "README.md"
keywords = ["git", "semver", "release", "cargo", "commit"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/src/**/*.rs",
  "/tests/**/*.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.simit.flake]
scope = "full"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
directories-next = "2"
fs2 = "0.4"
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = { version = "0.25", features = ["serde"] }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
